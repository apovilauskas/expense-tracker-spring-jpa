<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <main class="page">
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Personal dashboard</p>
                <h1>Expense Tracker</h1>
                <p class="subtitle">Built using JPA, Bean validation, Lombok, Thymeleaf</p>
            </div>
            <div class="stats">
                <article>
                    <span>Total expenses</span>
                    <strong th:text="${summary.totalEntries()}">0</strong>
                </article>
                <article>
                    <span>Total spent</span>
                    <strong th:text="${#numbers.formatDecimal(summary.totalAmount(), 1, 'COMMA', 2, 'POINT')}">€0.00</strong>
                </article>
            </div>
        </section>

        <section class="content">
            <div class="card form-card">
                <div class="card-header">
                    <h2>Add expense</h2>
                    <p th:if="${message}" class="success" th:text="${message}">Expense saved.</p>
                </div>
                <form th:action="@{/expenses}" th:object="${expense}" method="post" class="expense-form">
                    <label>
                        Title
                        <input type="text" th:field="*{title}" placeholder="Lunch, rent, fuel...">
                        <small th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small>
                    </label>

                    <label>
                        Description
                        <textarea th:field="*{description}" rows="3" placeholder="Optional note"></textarea>
                        <small th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></small>
                    </label>

                    <div class="grid-two">
                        <label>
                            Amount
                            <input type="number" th:field="*{cost}" step="0.01" min="0.01" placeholder="0.00">
                            <small th:if="${#fields.hasErrors('cost')}" th:errors="*{cost}"></small>
                        </label>

                        <label>
                            Category
                            <select th:field="*{category}">
                                <option value="">Select category</option>
                                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                            </select>
                            <small th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small>
                        </label>
                    </div>

                    <label>
                        Date
                        <input type="date" th:field="*{date}">
                        <small th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></small>
                    </label>

                    <button type="submit">Save expense</button>
                </form>
            </div>

            <div class="card list-card">
                <div class="card-header">
                    <h2>Recent expenses</h2>
                </div>
                <div th:if="${#lists.isEmpty(expenses)}" class="empty-state">
                    No expenses yet.
                </div>
                <table th:if="${!#lists.isEmpty(expenses)}">
                    <thead>
                    <tr>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Amount</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="expenseItem : ${expenses}">
                        <td>
                            <strong th:text="${expenseItem.title}">Groceries</strong>
                            <div class="muted" th:text="${expenseItem.description}">Weekly supermarket run</div>
                        </td>
                        <td th:text="${expenseItem.category}">FOOD</td>
                        <td th:text="${expenseItem.date}">2026-04-16</td>
                        <td th:text="${#numbers.formatDecimal(expenseItem.cost, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
